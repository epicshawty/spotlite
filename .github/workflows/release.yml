name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          $version = $tag -replace '^v', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/spotlite.exe, README.md, LICENSE -DestinationPath "dist/spotlite-windows-x64.zip"
          $hash = (Get-FileHash "dist/spotlite-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  spotlite-windows-x64.zip" | Set-Content "dist/spotlite-windows-x64.zip.sha256"
          "version=$version" >> $env:GITHUB_OUTPUT
        id: pkg

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Windows x64. Unzip; keep a fresh `soloist.exe` beside `spotlite.exe`.
            Requires Spotify Premium plus a developer app and Soloist API key.
            Verify the download against the `.sha256` file.
